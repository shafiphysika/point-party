<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClassGrove</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ClassGrove">
<meta name="theme-color" content="#172445">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🐣%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#EEF3FA; --surface:#FFFFFF; --soft:#F4F7FC; --ink:#172445; --muted:#5A6785; --line:#DCE4F0;
  --side:#172445; --side-ink:#EDF2FC; --side-muted:#9DAED0; --side-hi:#26375F;
  --brand:#FFB81C; --brand-ink:#3A2A00;
  --red:#F2473B; --sun:#FFC233; --sea:#1F8FE5; --leaf:#1FA35E; --plum:#8B4FD8; --pink:#EE4F98;
  --shadow:0 1px 2px rgba(23,36,69,.06),0 6px 18px rgba(23,36,69,.07);
  --press:0 3px 0 rgba(23,36,69,.16);
  --display:"Baloo 2","Nunito",system-ui,sans-serif;
  --body:"Nunito","Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --canvas:#0D172C; --surface:#162340; --soft:#1B2B4C; --ink:#EEF3FF; --muted:#A7B5D2; --line:#293D63;
    --side:#091021; --side-hi:#1C2B4D;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --press:0 3px 0 rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --canvas:#0D172C; --surface:#162340; --soft:#1B2B4C; --ink:#EEF3FF; --muted:#A7B5D2; --line:#293D63;
  --side:#091021; --side-hi:#1C2B4D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --press:0 3px 0 rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
.zh{font-family:var(--zh)}

/* ================= shell ================= */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:18px 12px 14px;position:sticky;top:0;
  height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px}
.brand .logo{width:42px;height:42px;border-radius:12px;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:1.6rem}
.brand b{font-family:var(--display);font-size:1.35rem;display:block;line-height:1}
.brand small{color:var(--side-muted);font-size:.85rem}
.group{color:var(--side-muted);font-size:.82rem;font-weight:700;padding:12px 10px 4px}
.sbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--side-ink);
  text-align:left;padding:8px 10px;border-radius:10px;font-weight:700;position:relative}
.sbtn:hover{background:var(--side-hi)}
.sbtn.on{background:var(--side-hi)}
.sbtn.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--brand)}
.sbtn .ic{width:24px;text-align:center;font-size:1.1rem}
.cbtn .num{font-family:var(--display);font-size:1.2rem;width:40px}
.cbtn .tch{font-family:var(--zh);font-size:.82rem;color:var(--side-muted);font-weight:500;flex:1}
.cbtn .pill{font-size:.8rem;background:rgba(255,255,255,.1);border-radius:999px;padding:1px 8px;color:var(--side-ink)}
.sync{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--side-muted);padding:14px 10px 4px}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--side-muted);flex:none}
.sync.ok i{background:#3DDC84}.sync.busy i{background:var(--brand)}

.mainwrap{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding:18px 28px 10px}
.tb-title{margin-right:auto;min-width:0}
.tb-title h1{font-size:1.85rem}
.tb-title p{margin:2px 0 0;color:var(--muted)}
.tb-right{display:flex;align-items:center;gap:8px}
.classsel{display:none;font-family:var(--display);font-weight:700;font-size:1.1rem;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px}
.timerchip{background:var(--sun);color:#172445;font-weight:800;border-radius:999px;padding:6px 14px;border:0;font-family:var(--display);font-size:1.05rem}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:44px;height:44px;font-size:1.2rem;box-shadow:var(--shadow)}
.mnav{display:none;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.mnav::-webkit-scrollbar{display:none}
.mnav button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;white-space:nowrap}
.mnav button.on{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
main{padding:6px 28px 40px;min-width:0}
.p-head{display:none}

/* ================= common ================= */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
.panel>h2{font-size:1.35rem;margin-bottom:4px}
.panel>.lead{color:var(--muted);margin:0 0 14px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--canvas)}
.seg button.on.minus{background:var(--red);color:#fff}
.seg button.on.abs{background:var(--muted);color:var(--surface)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 14px;font-weight:800;box-shadow:var(--press);text-decoration:none;color:var(--ink)}
.btn:active,.iconbtn:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.go{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn.brand{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--canvas)}
.btn.ghost{box-shadow:none;background:transparent;border-color:transparent;color:var(--muted)}
.btn.big{font-size:1.3rem;padding:12px 26px;border-radius:16px}
.stat{margin-left:auto;color:var(--muted)}
.stat b{color:var(--ink);font-family:var(--display);font-size:1.5rem;margin-left:4px}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form input,.form select,.form textarea,.cellsel,.cellnum{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.form input[type=url],.form input.wide{flex:2 1 260px}
.form input[type=text]{flex:1 1 170px}
textarea{width:100%;min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
.note{color:var(--muted);font-size:.92rem}
.empty{color:var(--muted);padding:6px 0}

/* ================= students ================= */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.card{position:relative;border:1px solid var(--line);background:var(--soft);border-radius:18px;padding:12px 8px 10px;
  display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:var(--press);transition:transform .08s}
.card:active{transform:scale(.96)}
.seat{position:absolute;top:7px;left:10px;font-family:var(--display);font-weight:800;color:var(--muted)}
.pet{font-size:2.6rem;line-height:1.1}
.name{font-family:var(--zh);font-weight:700;font-size:1.15rem;letter-spacing:.04em}
.pts{font-family:var(--display);font-weight:800;font-size:1.65rem;line-height:1;color:var(--sea)}
.card.absent{opacity:.42;filter:grayscale(.8)}
.card.pop{animation:pop .35s ease}
.card.levelup{animation:level .9s ease}
.float{position:absolute;top:-6px;left:50%;font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--leaf);pointer-events:none;animation:floatUp .8s ease-out forwards;transform:translateX(-50%)}
.float.neg{color:var(--red)}
.lvl{width:78%;height:7px;background:var(--surface);border-radius:999px;overflow:hidden;margin-top:5px}
.lvl span{display:block;height:100%;background:var(--leaf)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;padding:0;list-style:none;color:var(--muted);font-size:.92rem}
.legend li{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 12px}
@keyframes pop{40%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes level{0%{transform:scale(1)}25%{transform:scale(1.18) rotate(-4deg)}60%{transform:scale(1.05) rotate(3deg)}100%{transform:scale(1)}}
@keyframes floatUp{to{transform:translate(-50%,-46px);opacity:0}}

/* ================= fame ================= */
.goal-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.goal-top h2{font-size:1.5rem}
.gnum{font-family:var(--display);font-size:2rem;font-weight:800;margin-left:auto}
.gbar{height:30px;background:var(--soft);border-radius:999px;overflow:hidden;border:1px solid var(--line);margin-top:6px}
.gbar span{display:block;height:100%;background:var(--leaf);border-radius:999px;transition:width .6s}
.gbar.done span{background:var(--sun)}
.gsub{margin:8px 0 12px;font-weight:800;font-size:1.15rem}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:6px}
.pod{display:flex;flex-direction:column;align-items:center;border:0;background:transparent;padding:0}
.pod .pp{font-size:3.6rem;line-height:1.1}
.pod .pn{font-family:var(--zh);font-weight:700;font-size:1.35rem}
.pod .ps{color:var(--muted);font-weight:800}
.pod .pb{width:min(28vw,130px);border-radius:14px 14px 0 0;display:flex;justify-content:center;font-family:var(--display);font-size:2.2rem;font-weight:800;color:#fff;padding-top:4px;margin-top:4px}
.pod.p1 .pb{height:130px;background:var(--sun);color:#172445}
.pod.p2 .pb{height:95px;background:var(--sea)}
.pod.p3 .pb{height:70px;background:var(--red)}
.improvers{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.imp{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--soft);border-radius:16px;padding:6px 14px 6px 8px;box-shadow:var(--press)}
.imp .ip{font-size:2rem}.imp .in{font-family:var(--zh);font-weight:700;font-size:1.15rem}
.imp .ig{font-family:var(--display);font-weight:800;color:var(--leaf);font-size:1.35rem}

/* ================= teams + mystery ================= */
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.team{border-radius:20px;background:var(--soft);border:3px solid var(--tc);overflow:hidden;display:flex;flex-direction:column}
.team header{background:var(--tc);color:var(--tt);display:flex;align-items:center;gap:10px;padding:10px 14px}
.ticon{font-size:2rem}
.team h2{font-size:1.3rem}
.team header small{font-family:var(--zh);opacity:.9}
.crown{margin-left:auto;font-size:1.8rem;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.tscore{font-family:var(--display);font-size:4.4rem;font-weight:800;text-align:center;line-height:1;padding:14px 0 6px}
.tscore.pop{animation:pop .35s ease}
.tbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 12px 12px}
.tbtns button{border:0;border-radius:12px;padding:10px 0;font-family:var(--display);font-weight:800;font-size:1.25rem;background:var(--tc);color:var(--tt)}
.tbtns button.minus{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.members{list-style:none;margin:0;padding:10px 12px 14px;border-top:2px dashed var(--line);display:flex;flex-wrap:wrap;gap:6px}
.members li{font-family:var(--zh);background:var(--surface);border-radius:8px;padding:2px 8px;font-size:.95rem}
.members b{color:var(--muted);font-family:var(--display);margin-right:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{position:relative;border:3px solid var(--tc);background:var(--surface);border-radius:14px;padding:4px 12px;display:flex;align-items:center;gap:8px;font-weight:800}
.chip b{font-family:var(--display);font-size:1.5rem}
.chip.on{background:var(--tc);color:var(--tt);transform:translateY(-2px);box-shadow:var(--press)}
.chip i{font-style:normal;position:absolute;top:-10px;right:-8px;background:var(--ink);color:var(--canvas);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:800}
.msg{min-height:2.6rem;font-family:var(--display);font-size:1.5rem;font-weight:800;margin:4px 0 12px}
.boxes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:780px}
.box{aspect-ratio:1.25;border:0;border-radius:18px;font-family:var(--display);font-size:2.4rem;font-weight:800;color:#fff;background:var(--sea);
  box-shadow:0 6px 0 rgba(23,36,69,.28);display:flex;align-items:center;justify-content:center;flex-direction:column}
.box:nth-child(4n+2){background:var(--plum)}.box:nth-child(4n+3){background:var(--pink)}.box:nth-child(4n+4){background:var(--leaf)}
.box.open{background:var(--soft)!important;color:var(--ink);box-shadow:none;border:3px solid var(--bc,var(--line));font-size:1.2rem;animation:flip .45s ease}
.box.open .bi{font-size:2rem;line-height:1}
.box.open small{font-family:var(--body);font-size:.8rem;color:var(--muted)}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}

/* ================= picker + timer ================= */
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--soft);border:3px dashed var(--line);border-radius:24px;min-height:300px;padding:24px;margin-bottom:16px}
.pick-seat{font-family:var(--display);font-size:1.6rem;font-weight:800;color:var(--muted);min-height:2rem}
.pick-name{font-family:var(--zh);font-weight:700;font-size:clamp(3rem,11vw,7rem);line-height:1.1;letter-spacing:.06em}
.pick-name.rolling{color:var(--muted)}
.pick-name.done{animation:level .9s ease}
.center{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px}
.timerwrap{display:flex;flex-direction:column;align-items:center;gap:18px}
.ring{position:relative;width:min(70vw,340px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--soft)}
.ring .prog{stroke:var(--leaf);transition:stroke .3s}
.ring .prog.warn{stroke:var(--sun)}.ring .prog.end{stroke:var(--red)}
.ring .time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:clamp(3rem,13vw,5.5rem);font-weight:800}
.ring.flash{animation:pop .5s ease 4}

/* ================= games ================= */
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.site{display:flex;gap:10px;align-items:flex-start;text-decoration:none;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:var(--press)}
.site:active{transform:translateY(2px);box-shadow:none}
.site .si{font-size:1.8rem;line-height:1}
.site b{display:block;font-size:1.08rem;line-height:1.15}
.site small{color:var(--muted);font-size:.88rem;line-height:1.25;display:block}
.plat{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.plat button{border:2px solid var(--line);background:var(--soft);border-radius:14px;padding:10px 8px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
.plat button span{font-size:1.6rem}
.plat button.on{border-color:var(--sea);background:var(--surface);box-shadow:0 0 0 3px rgba(31,143,229,.18)}
.mylinks{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.mylinks li{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:6px 8px 6px 14px;flex-wrap:wrap}
.mylinks a{flex:1 1 160px;color:var(--ink);font-weight:800;text-decoration:none;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:.78rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1px 8px;color:var(--muted)}

/* ================= import + records ================= */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:0 0 16px;padding:0;list-style:none;counter-reset:s}
.steps li{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 50px;position:relative;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:12px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--canvas);font-family:var(--display);font-weight:800;display:flex;align-items:center;justify-content:center}
.steps b{display:block}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;margin:12px 0}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--soft);font-size:.85rem;color:var(--muted);font-weight:800;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.nm{font-family:var(--zh);font-weight:700}
td.num{font-family:var(--display);font-weight:800;font-size:1.1rem}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
tr.unmatched td{color:var(--muted)}
.cellnum{width:72px}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.8rem;font-weight:800;background:var(--soft);border:1px solid var(--line)}
.badge.ok{background:rgba(31,163,94,.12);border-color:transparent;color:var(--leaf)}
.badge.warn{background:rgba(242,71,59,.1);border-color:transparent;color:var(--red)}
.dropzone{border:2px dashed var(--line);border-radius:16px;padding:16px;background:var(--soft);display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ================= overlay ================= */
.overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--side);color:#fff;overflow:auto}
.overlay[hidden]{display:none}
.overlay.dim{background:rgba(10,18,40,.6)}
.overlay .btn{color:var(--ink)}.overlay .btn.go{color:#fff}.overlay .btn.brand{color:var(--brand-ink)}
.ov-close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:8px 14px;font-weight:800}
.sp-head{font-family:var(--display);font-size:clamp(1.6rem,5vw,2.6rem);font-weight:800;color:var(--sun)}
.sp-pet{font-size:clamp(6rem,24vw,12rem);line-height:1.05;animation:level .9s ease}
.sp-name{font-family:var(--zh);font-weight:700;font-size:clamp(3rem,11vw,6.5rem);letter-spacing:.06em;line-height:1.1}
.sp-pts{font-family:var(--display);font-size:clamp(1.6rem,5vw,2.6rem);font-weight:800}
.sp-week{font-size:1.3rem;color:var(--sun);font-weight:800}
.sp-bar{width:min(80vw,520px);height:22px;background:rgba(255,255,255,.18);border-radius:999px;overflow:hidden;margin:14px auto 6px}
.sp-bar span{display:block;height:100%;background:var(--sun)}
.sp-next{font-size:1.4rem;font-weight:800;margin-bottom:6px}
.overlay small{opacity:.7}
.dlg{background:var(--surface);color:var(--ink);border-radius:20px;padding:22px;max-width:520px;width:100%;cursor:default;text-align:left;box-shadow:0 10px 40px rgba(0,0,0,.3);max-height:85vh;overflow:auto}
.dlg h3{font-size:1.4rem;margin-bottom:6px}
.dlg p{margin:0 0 14px;font-weight:700;font-size:1.1rem}
.dlg ul{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
.dlg li{display:flex;justify-content:space-between;gap:10px;background:var(--soft);border-radius:10px;padding:6px 10px}
.join{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:clamp(20px,5vw,64px);cursor:default;max-width:1200px;width:100%}
.qrbox{background:#fff;border-radius:24px;padding:16px;width:min(78vw,420px);box-shadow:0 0 0 8px var(--brand)}
.qrbox svg{display:block;width:100%;height:auto}
.jinfo{text-align:left;max-width:520px}
.j-title{font-family:var(--display);font-size:clamp(2rem,5vw,3.2rem);font-weight:800;color:var(--brand);line-height:1.1}
.j-row{margin-top:16px;font-size:clamp(1.1rem,2.4vw,1.5rem);font-weight:700}
.j-row span{display:block;font-size:.8em;opacity:.75;font-weight:700}
.j-url{font-family:var(--display);font-size:clamp(1.4rem,3vw,2.2rem);word-break:break-all}
.j-code{font-family:var(--display);font-size:clamp(3.4rem,10vw,6.5rem);font-weight:800;letter-spacing:.08em;line-height:1;color:var(--sun)}
.j-nick{background:rgba(255,255,255,.12);border-radius:14px;padding:10px 14px;display:inline-block}
.conf{position:fixed;top:-20px;width:10px;height:16px;z-index:30;border-radius:2px;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140px);background:var(--ink);color:var(--canvas);padding:10px 20px;border-radius:999px;font-weight:800;transition:transform .25s;z-index:40;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.exitp{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;border:0;border-radius:999px;padding:9px 16px;background:rgba(255,255,255,.16);color:#fff;font-weight:800;backdrop-filter:blur(6px)}
.exitp[hidden]{display:none}

/* ================= present (kid display) ================= */
body.present{background:var(--side);background-image:radial-gradient(circle at 12% 18%,rgba(255,194,51,.16) 0 70px,transparent 71px),radial-gradient(circle at 88% 12%,rgba(31,143,229,.2) 0 110px,transparent 111px),radial-gradient(circle at 80% 92%,rgba(238,79,152,.16) 0 90px,transparent 91px)}
body.present .app{grid-template-columns:1fr}
body.present .side,body.present .topbar,body.present .mnav,body.present .t-only{display:none!important}
body.present main{padding:20px clamp(16px,3vw,40px) 70px}
body.present .p-head{display:flex;align-items:center;gap:14px;color:#fff;padding:4px 4px 16px}
.p-head .pi{font-size:2.6rem}
.p-head h2{font-size:clamp(2rem,4vw,3rem);color:var(--brand)}
.p-head span.pp{font-family:var(--display);font-size:clamp(1.3rem,2.5vw,1.9rem);font-weight:700;opacity:.9}
body.present .panel{border:0}
body.present .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .classsel{display:inline-block}
  .mnav{display:flex}
  .topbar{padding:14px 16px 10px}
  .tb-title h1{font-size:1.5rem}
  main{padding:4px 16px 32px}
}
@media (max-width:600px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
  .pet{font-size:2.1rem}.name{font-size:1rem}
  .boxes{gap:8px}.box{font-size:1.8rem}
  .stat{margin-left:0}
  .panel{padding:14px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="party.css">
<script src="config.js"></script>

<body>
<div class="app">
  <aside class="side" aria-label="Classes and pages">
    <div class="brand"><span class="logo" aria-hidden="true">🐣</span><div><b>ClassGrove</b><small>Learn. Grow. Belong.</small></div></div>

        <button id="timerChip" class="timerchip" data-act="nav" data-page="timer" hidden></button>
        <button id="soundBtn" class="iconbtn" data-act="sound" aria-label="Sound on or off">🔊</button>
        <button class="btn brand" data-act="present">🖥️ Show on screen</button>
      </div>
    </header>
    <nav class="mnav" id="mnav" aria-label="Pages"></nav>
    <main>
      <div class="p-head" id="phead"></div>
      <div id="view"></div>
    </main>
  </div>
</div>
<button class="exitp" id="exitp" data-act="present" hidden>✕ Exit display</button>

/* ================= cloud sync (same Claude account on PC + iPad) ================= */
const SYNC={db:null,uid:null,timers:{},writing:{},dirty:{},last:{}};
function setSync(s){
  const el=$("#sync");el.className="sync "+(s==="synced"?"ok":s==="saving"?"busy":"");
  el.querySelector("span").textContent=s==="synced"?"Synced to your account":s==="saving"?"Saving…":"Saved in this browser";
}
const docId=key=>key==="settings"?"settings":"c"+key;
const colPath=()=>"data/users/"+SYNC.uid;
function markDirty(key){
  if(window.PartyWorkspace&&PartyWorkspace.online){PartyWorkspace.queueSave();return;}
  if(!SYNC.db)return;
  SYNC.dirty[key]=true;clearTimeout(SYNC.timers[key]);
  SYNC.timers[key]=setTimeout(()=>flush(key),700);
}
async function flush(key){
  if(!SYNC.db||!SYNC.dirty[key])return;
  if(SYNC.writing[key]){SYNC.timers[key]=setTimeout(()=>flush(key),400);return;}
  SYNC.dirty[key]=false;SYNC.writing[key]=true;setSync("saving");
  const body=key==="settings"?{links:store.links,roster:CLASSES}:{data:store.classes[key]||{}};
  const json=JSON.stringify(body);SYNC.last[key]=json;
  try{await SYNC.db.collection(colPath()).doc(docId(key)).set(JSON.parse(json));setSync("synced");}
  catch(e){
    const code=e&&e.code;
    if(code==="unavailable"||code==="resource_exhausted"){SYNC.dirty[key]=true;setTimeout(()=>flush(key),1500+Math.random()*1500);}
    else if(code==="quota_exceeded"){toast("Cloud storage is full. Points are still saved on this device.");setSync("local");}
    else setSync("local");
  }finally{SYNC.writing[key]=false;}
}
function applyDocs(docs){
  let changed=false;
  docs=docs.slice().sort((a,b)=>(a.id==="settings"?0:1)-(b.id==="settings"?0:1));
  docs.forEach(d=>{
    if(!d.exists||(d.metadata&&d.metadata.hasPendingWrites))return;
    const key=d.id==="settings"?"settings":d.id.replace(/^c/,"");
    if(key!=="settings"&&!CLASSES[key])return;
    if(SYNC.dirty[key]||SYNC.writing[key])return;
    const body=d.data()||{},json=JSON.stringify(body);
    if(json===SYNC.last[key])return;
    SYNC.last[key]=json;
    const copy=JSON.parse(json);
    if(key==="settings"){store.links=Array.isArray(copy.links)?copy.links:[];
      if(copy.roster&&typeof copy.roster==="object"&&Object.keys(copy.roster).length){CLASSES=copy.roster;store.roster=CLASSES;if(!CLASSES[ui.cur])ui.cur=Object.keys(CLASSES)[0]||null;}
      changed=true;}
    else if(copy.data){store.classes[key]=copy.data;changed=true;}
  });
  if(changed){saveLocal();if(!rolling&&$("#overlay").hidden)render();}
}
async function initSync(){
  if(!(window.claude&&typeof window.claude.use==="function")){setSync("local");return;}
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user){setSync("local");return;}
    const uid=await user.id();
    if(!uid){setSync("local");return;}
    SYNC.db=db;SYNC.uid=uid;
    const col=db.collection(colPath());
    const first=await col.get();
    const have=new Set(first.docs.filter(d=>d.exists).map(d=>d.id));
    applyDocs(first.docs);
    for(const id of Object.keys(store.classes))if(CLASSES[id]&&!have.has(docId(id))){SYNC.dirty[id]=true;await flush(id);}
    if(!have.has("settings")){SYNC.dirty.settings=true;await flush("settings");}
    col.onSnapshot(s=>applyDocs(s.docs),()=>setSync("local"));
    setSync("synced");
  }catch(e){setSync("local");}
}

let actx=null;
function tone(f,d=.12,type="triangle",delay=0,vol=.18){
  if(!ui.sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume().catch(()=>{});const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}

function levelProgress(p){const asc=STAGES.slice().reverse(),nx=asc.find(s=>s[0]>p),cur=asc.filter(s=>s[0]<=p).pop();

function qrSvg(text){
  try{const q=qrcode(0,"M");q.addData(text);q.make();const n=q.getModuleCount(),m=2;let d="";
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m} ${r+m}h1v1h-1z`;
    return `<svg viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" role="img" aria-label="QR code for ${esc(text)}"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#172445"/></svg>`;}
  catch(e){return `<p style="color:#172445">This link is too long for a QR code.</p>`;}
}

const PRIZES=[["add",1],["add",1],["add",1],["add",2],["add",2],["add",2],["add",3],["add",3],["add",5],["add",10],["double",0],["lose",2],["lose",2],["steal",2],["steal",2],["all",1]];

RENDER.mystery=()=>{

  <p class="note t-only" style="margin-top:14px">Ask a question. A team that answers correctly opens a box: points, double, steal from the leader, or a bomb. Then the turn passes on.</p></div>`;

function openBox(i){
  const c=C(),b=c.boxes[i];if(!b||b.open)return;snap();const ti=c.active,s=c.tscore,T=TEAM_META[ti];let msg="",good=true;
  switch(b.k){
    case "add":s[ti]+=b.v;msg=`${T.icon} ${T.name} +${b.v}!`;break;
    case "double":if(s[ti]>0){msg=`${T.icon} ${T.name} doubles: ${s[ti]} → ${s[ti]*2}!`;s[ti]*=2;}else{s[ti]+=2;msg=`${T.icon} ${T.name} had 0, so Double gives +2!`;}break;
    case "lose":{const l=Math.min(b.v,s[ti]);s[ti]-=l;msg=`💣 Boom! ${T.name} −${l}`;good=false;break;}
    case "steal":{let best=-1;s.forEach((v,k)=>{if(k!==ti&&v>0&&(best<0||v>s[best]))best=k;});
      if(best<0){s[ti]+=1;msg=`🦝 Nobody to steal from, so ${T.name} +1`;}else{const amt=Math.min(b.v,s[best]);s[best]-=amt;s[ti]+=amt;msg=`🦝 ${T.name} steals ${amt} from ${TEAM_META[best].name}!`;}break;}
    default:s.forEach((_,k)=>s[k]++);msg="🎉 Every team +1!";
  }
  b.open=true;b.by=ti;c.msg=msg;c.active=(ti+1)%c.teamCount;save();RENDER.mystery();good?(b.k==="add"&&b.v<5?sfx.plus():sfx.cheer()):sfx.bad();
  if(c.boxes.every(x=>x.open)){const max=Math.max(...s),w=s.map((v,k)=>v===max?k:-1).filter(k=>k>=0);

}

let rolling=false,noRepeat=true;

  <div class="center t-only" style="margin-top:14px">

    ${noRepeat?`<span class="stat" style="margin:0">Still waiting<b>${left}</b></span><button class="btn ghost" data-act="pickreset">Start over</button>`:""}
  </div></div>`;
  if(last){$("#dice-number").textContent=last.seat;$("#dice-student").textContent=last.name;view.querySelector('.baby-talk').textContent="Your turn!";}

function pick(){
  if(rolling)return;const c=C(),pres=present();if(!pres.length){toast("Everyone is marked absent");return;}
  let pool=noRepeat?pres.filter(s=>!c.picked.includes(s.seat)):pres;
  if(!pool.length){c.picked=[];pool=pres;toast("Everyone had a turn. New round!");}
  const win=pool[LuckyDice.randomIndex(pool.length)],classId=ui.cur,repeatMode=noRepeat,effect=LuckyDice.resolveEffect(LuckyDice.preference());
  rolling=true;const nm=$("#pname"),st=$("#pseat"),stageEl=nm.closest('.lucky-stage');
  stageEl.classList.remove('has-winner');stageEl.classList.add('is-rolling');stageEl.setAttribute('aria-busy','true');
  nm.textContent="Rolling…";st.textContent="Shaking up the luck!";
  stageEl.querySelector('.dice-hint').textContent="Here comes our lucky student…";
  stageEl.querySelector('.baby-talk').textContent="Shake, shake!";
  view.querySelectorAll('[data-act="pick"],[data-act="pickplus"],[data-act="norep"],[data-act="pickreset"],[data-act="diceeffect"]').forEach(b=>b.disabled=true);
  const quiet=matchMedia('(prefers-reduced-motion: reduce)').matches||document.body.classList.contains('v-paused');
  const show=['show','machine','magic'].includes(effect)?LuckyDice.cinema(quiet,()=>pick(),effect):{close(){},finish(){}};
  if(!quiet&&ui.sound)LuckyDice.sound(effect,tone);
  let n=0;const step=()=>{
    if(!quiet&&ui.cur===classId&&ui.mode==='picker'&&ui.sound)tone(effect==='machine'?180+n*25:600+n*35,.04,'triangle',0,.04);
    if(effect==='original'&&!quiet){const preview=pres[Math.floor(Math.random()*pres.length)];nm.textContent=preview.name;st.textContent='Seat '+preview.seat;}
    if(++n<(quiet?1:18)){setTimeout(step,50+n*9);return;}
    rolling=false;
    // A navigation or school change cancels the draw rather than saving into another class.
    if(ui.cur!==classId||ui.mode!=='picker'||C()!==c){show.close();return;}
    c.last=win.seat;if(repeatMode&&!c.picked.includes(win.seat))c.picked.push(win.seat);
    save();RENDER.picker();$("#pname").classList.add("done");show.finish(win);sfx.cheer();if(!quiet)confetti(35);
  };
  setTimeout(step,quiet?150:effect==='magic'?1350:100);
}

const timer={total:60,left:60,running:false,end:0,iv:null};
const fmt=s=>{s=Math.ceil(s);return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;};
RENDER.timer=()=>{const R=90,L=2*Math.PI*R;
  view.innerHTML=`<div class="panel"><div class="timerwrap">
    <div class="seg" role="group" aria-label="Preset times">${[[30,"30 sec"],[60,"1 min"],[120,"2 min"],[180,"3 min"],[300,"5 min"],[600,"10 min"]].map(p=>`<button data-act="tset" data-v="${p[0]}" class="${timer.total===p[0]?"on":""}">${p[1]}</button>`).join("")}</div>
    <div class="ring" id="ring"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="track" cx="100" cy="100" r="${R}" fill="none" stroke-width="18"/><circle class="prog" id="prog" cx="100" cy="100" r="${R}" fill="none" stroke-width="18" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="0"/></svg><div class="time" id="ttime" role="timer">${fmt(timer.left)}</div></div>
    <div class="center"><button class="btn go big" data-act="tgo">${timer.running?"Pause":timer.left<timer.total&&timer.left>0?"Resume":"Start"}</button><button class="btn big" data-act="tplus">+30 sec</button><button class="btn big" data-act="treset">Reset</button></div>
  </div></div>`;paintTimer();};
function paintTimer(){const p=$("#prog"),t=$("#ttime");if(!p||!t)return;const L=2*Math.PI*90,frac=timer.total?timer.left/timer.total:0;p.style.strokeDashoffset=String(L*(1-frac));t.textContent=fmt(timer.left);p.classList.toggle("warn",timer.left<=10&&timer.left>0);p.classList.toggle("end",timer.left<=0);}
function updateTimerChip(){const chip=$("#timerChip");if(timer.running&&ui.mode!=="timer"){chip.hidden=false;chip.textContent="⏱️ "+fmt(timer.left);}else chip.hidden=true;}
function tick(){timer.left=Math.max(0,(timer.end-Date.now())/1000);paintTimer();updateTimerChip();
  if(timer.left<=0){clearInterval(timer.iv);timer.running=false;sfx.alarm();toast("⏰ Time's up!");if(ui.mode==="timer"){RENDER.timer();bump($("#ring"),"flash");}updateTimerChip();}}
function timerGo(){if(timer.running){clearInterval(timer.iv);timer.running=false;timer.left=Math.max(0,(timer.end-Date.now())/1000);}else{if(timer.left<=0)timer.left=timer.total;timer.end=Date.now()+timer.left*1000;timer.running=true;timer.iv=setInterval(tick,200);}RENDER.timer();}
function timerSet(v){clearInterval(timer.iv);timer.running=false;timer.total=v;timer.left=v;RENDER.timer();updateTimerChip();}
function timerPlus(){timer.left+=30;timer.total=Math.max(timer.total,timer.left);if(timer.running)timer.end+=30000;RENDER.timer();}

let IMP=null;
const NAME_RE=/(nick ?name|player|student|name|姓名|暱稱|名字|學生)/i;
const SCORE_RE=/(score|points|total|correct|accuracy|分數|得分|總分|正確)/i;
function parseDelimited(text){
  text=String(text).replace(/^\uFEFF/,"").replace(/\r\n?/g,"\n");
  const head=text.split("\n").slice(0,12).join("\n");
  const delim=head.includes("\t")?"\t":((head.match(/;/g)||[]).length>(head.match(/,/g)||[]).length?";":",");
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"'&&cell===""){q=true;}
    else if(ch===delim){row.push(cell);cell="";}
    else if(ch==="\n"){row.push(cell);rows.push(row);row=[];cell="";}
    else cell+=ch;}
  if(cell!==""||row.length){row.push(cell);rows.push(row);}
  return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(x=>x!==""));
}
const num=s=>{const m=String(s).replace(/[,\s$]/g,"").match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):NaN;};
function detectCols(rows){
  for(let i=0;i<Math.min(rows.length,15);i++){const r=rows[i];
    let ni=r.findIndex(x=>/nick ?name|player|暱稱/i.test(x));if(ni<0)ni=r.findIndex(x=>NAME_RE.test(x)&&x.length<30);
    if(ni<0)continue;
    let si=-1;for(const re of [/total score|final score|總分/i,/score|分數|得分/i,/points/i,/correct|accuracy|正確/i,/total/i]){si=r.findIndex((x,k)=>k!==ni&&re.test(x)&&x.length<30);if(si>=0)break;}
    return{h:i,ni,si,headers:r};}
  return{h:-1,ni:0,si:rows[0]&&rows[0].length>1?1:-1,headers:(rows[0]||[]).map((_,k)=>"Column "+(k+1))};
}
function matchStudent(nick,list){
  const s=String(nick).normalize("NFKC").trim();
  let m=s.match(/(?:^|\D)(\d{3})\s*[-_.#\s]\s*(\d{1,2})(?!\d)/);
  if(m&&CLASSES[m[1]]&&m[1]===ui.cur){const seat=+m[2];if(list.some(x=>x.seat===seat))return seat;}
  m=s.match(/^\s*(?:no\.?|#|seat)?\s*(\d{1,2})(?!\d)/i);
  if(m){const seat=+m[1];if(list.some(x=>x.seat===seat))return seat;}
  let hits=list.filter(x=>s.includes(x.name));if(hits.length===1)return hits[0].seat;
  hits=list.filter(x=>x.name.length>=3&&s.includes(x.name.slice(1)));if(hits.length===1)return hits[0].seat;
  return 0;
}
function buildImport(text,game){
  const rows=parseDelimited(text);if(!rows.length)throw new Error("empty");
  const {h,ni,si}=detectCols(rows),list=students(ui.cur);
  let items=rows.slice(h+1).filter(r=>r[ni]&&!/^(total|average|avg|平均|合計)/i.test(r[ni])).map(r=>({nick:r[ni],scoreText:si>=0?(r[si]||""):"",score:si>=0?num(r[si]):NaN,seat:matchStudent(r[ni],list)}));
  if(!items.length)throw new Error("norows");
  items.sort((a,b)=>(isNaN(b.score)?-Infinity:b.score)-(isNaN(a.score)?-Infinity:a.score));
  const used=new Set();items.forEach(it=>{if(it.seat&&used.has(it.seat)){it.seat=0;it.dup=true;}else if(it.seat)used.add(it.seat);});
  IMP={game:game||"Online game",items,rule:"rank",teams:false};applyRule();
}
function applyRule(){
  let rank=0,prev=null;IMP.items.forEach((it,i)=>{if(isNaN(it.score)){it.rank=null;return;}if(it.score!==prev){rank=i+1;prev=it.score;}it.rank=rank;});
  const n=IMP.items.filter(x=>x.rank).length,half=Math.ceil(n/2);
  IMP.items.forEach(it=>{it.pts=IMP.rule==="rank"?(it.rank===1?5:it.rank===2?4:it.rank===3?3:(it.rank&&it.rank<=half)?2:1):IMP.rule==="flat2"?2:1;});
}
function readAs(file,how){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);how==="buf"?r.readAsArrayBuffer(file):r.readAsText(file);});}
function loadScript(src){return new Promise((res,rej)=>{if(window.XLSX)return res();const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("load"));document.head.appendChild(s);});}
async function readFile(file){
  if(/\.(xlsx|xls)$/i.test(file.name)){
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    const wb=XLSX.read(await readAs(file,"buf"),{type:"array"});
    const sn=wb.SheetNames.find(n=>/final|score|result|overview|summary/i.test(n))||wb.SheetNames[0];
    return XLSX.utils.sheet_to_csv(wb.Sheets[sn]);
  }
  return await readAs(file,"text");
}

function parseNames(text){
  const lines=String(text).replace(/\r/g,"").split("\n").map(l=>l.replace(/^\s*\d{1,2}[.)、\s]+/,"").trim());

  while(lines.length&&!lines[0])lines.shift();
  return lines.map(l=>(!l||l==="-"||l==="—")?null:l.slice(0,20));
}

    ui.cur=Object.keys(roster)[0];undoStack=[];IMP=null;editCls=null;saveLocal();
    markDirty("settings");Object.keys(store.classes).forEach(id=>markDirty(id));
    if(ui.mode==="setup")ui.mode="students";render();confetti();sfx.level();toast("Backup loaded");
  },"Load backup");
}

/* ================= present mode ================= */
function togglePresent(){
  const on=!document.body.classList.contains("present");
  document.body.classList.toggle("present",on);$("#exitp").hidden=!on;
  try{if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});else if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{});}catch(e){}
  window.scrollTo(0,0);
}

/* ================= events ================= */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(window.PartyWorkspace?.online){
    const pointActions=['allskill','allplus','resetStu','spplus','newweek','tadd','resetTeams','pickplus','impapply'];
    const activityActions=['savegoal','tcount','shuffle','active','box','newboard','pick','pickreset','addlink','dellink'];
    const rosterActions=['savecls','delcls'];
    const permission=rosterActions.includes(a)?'roster':activityActions.includes(a)?'activities':pointActions.includes(a)?'points':a==='stu'?(sMode==='absent'?'roster':'points'):null;
    if(permission&&!PartyWorkspace.can(permission)){toast('Ask your administrator to enable '+permission+' permission.');return;}
    if(a==='nav'&&['teams','mystery','picker'].includes(b.dataset.page)&&!PartyWorkspace.can('activities')){toast('Ask your administrator to enable activities permission.');return;}
    if(a==='undo'&&!['points','activities','roster'].every(k=>PartyWorkspace.can(k))){toast('Undo needs points, activities and roster permission.');return;}
    if(['delcls','savecls'].includes(a)&&!['points','activities','roster','materials'].every(k=>PartyWorkspace.can(k))){toast('Adding, editing or deleting a class needs all classroom editing permissions.');return;}
  }
  switch(a){
    case "class":ui.cur=b.dataset.id;IMP=null;save("settings");render();break;
    case "nav":ui.mode=b.dataset.page;saveLocal();render();window.scrollTo(0,0);break;
    case "sound":ui.sound=!ui.sound;saveLocal();renderShell();if(ui.sound)sfx.plus();break;
    case "present":togglePresent();break;
    case "skill":selectedSkill=b.dataset.id;sMode="skill";RENDER.students();break;
    case "allskill":{const c=C(),bt=classTotal(c);snap();students(ui.cur).forEach(s=>PartyCore.awardSkill(c,s.seat,selectedSkill,today()));save();render();confetti(35);sfx.cheer();toast(skillNow().name+" for everyone present!");checkGoal(bt);break;}
    case "smode":sMode=b.dataset.v;RENDER.students();break;
    case "stu":tapStudent(+b.dataset.seat);break;
    case "allplus":everyonePlus();break;
    case "sort":sortBy=sortBy==="seat"?"pts":"seat";RENDER.students();break;
    case "undo":undo();break;
    case "resetStu":askConfirm(`Reset all student points for class ${ui.cur}? Game history is kept.`,()=>{snap();const k=C();k.pts={};k.weekBase={};save();render();toast("Points reset. Undo is still available.");},"Reset");break;
    case "spot":spotlight(+b.dataset.seat);sfx.cheer();break;
    case "spotFromRec":spotlight(+b.dataset.seat);sfx.cheer();break;
    case "spplus":{const k=C(),seat=+b.dataset.seat;if(k.absent[seat]){toast("This student is marked absent");break;}const bt=classTotal(k),before=k.pts[seat]||0;snap();k.pts[seat]=before+1;save();
      const up=stage(before)!==stage(before+1);spotlight(seat,up?"🎉 Level up! 🎉":"⭐ +1 point! ⭐");up?sfx.level():sfx.plus();render();checkGoal(bt);break;}
    case "savegoal":{const k=C(),g=parseInt($("#ggoal").value,10),r=$("#greward").value.trim();if(!(g>0)){toast("Type a goal number, like 300");break;}k.goal=g;k.reward=r||"Game day!";save();RENDER.fame();toast("Goal saved");break;}
    case "newweek":askConfirm("Start counting a new week? Total points and pets stay the same.",()=>{snap();const k=C();k.weekBase=Object.assign({},k.pts);k.weekStart=today();save();RENDER.fame();toast("New week started!");},"Start week");break;
    case "recsort":recSort=b.dataset.v;RENDER.records();break;
    case "record":recordDetail(+b.dataset.seat);break;
    case "export":exportCSV();break;
    case "tadd":teamAdd(+b.dataset.t,+b.dataset.v);break;
    case "tcount":setTeamCount(+b.dataset.v);break;
    case "shuffle":shuffleTeams(false);break;
    case "resetTeams":askConfirm(`Reset team scores for class ${ui.cur}?`,()=>{snap();const k=C();k.tscore=k.tscore.map(()=>0);k.boxes=null;k.active=0;save();render();},"Reset");break;
    case "active":{const k=C();k.active=+b.dataset.t;k.msg="";save();RENDER.mystery();break;}
    case "box":openBox(+b.dataset.i);break;
    case "newboard":snap();newBoard(C());save();RENDER.mystery();break;
    case "pick":pick();break;
    case "diceeffect":if(rolling)break;LuckyDice.setPreference(b.dataset.v);RENDER.picker();break;
    case "pickplus":{const k=C();if(k.last&&!k.absent[k.last]){const bt=classTotal(k);snap();k.pts[k.last]=(k.pts[k.last]||0)+1;save();renderShell();sfx.plus();toast(`+1 for ${nameMap(ui.cur)[k.last]} (now ${k.pts[k.last]})`);checkGoal(bt);}break;}
    case "norep":if(rolling)break;noRepeat=b.dataset.v==="1";RENDER.picker();break;
    case "pickreset":{if(rolling)break;snap();const k=C();k.picked=[];k.last=null;save();RENDER.picker();break;}
    case "tset":timerSet(+b.dataset.v);break;
    case "tgo":timerGo();break;
    case "tplus":timerPlus();break;
    case "treset":timerSet(timer.total);break;
    case "plat":joinPlat=b.dataset.v;RENDER.games();break;
    case "showjoin":showJoin();break;
    case "addlink":addLink();break;
    case "linkqr":{const l=store.links.find(x=>x.id===b.dataset.id);if(l)joinScreen(l.name,l.url,l.url.replace(/^https?:\/\//,"").slice(0,60),"");break;}
    case "dellink":{const id=b.dataset.id;askConfirm("Delete this saved game?",()=>{store.links=store.links.filter(l=>l.id!==id);save("settings");RENDER.games();},"Delete");break;}
    case "impread":{const t=$("#ipaste").value;if(!t.trim()){toast("Paste the results table first");break;}impFrom(t);break;}
    case "impcancel":IMP=null;RENDER.import();break;
    case "impapply":applyImport();break;
    case "editcls":editCls=b.dataset.id;RENDER.setup();window.scrollTo(0,document.body.scrollHeight);break;
    case "cancelcls":editCls=null;RENDER.setup();break;
    case "savecls":saveClass();break;
    case "delcls":{const id=b.dataset.id;askConfirm(`Delete class ${id} and all its points and records? Save a backup first if you might need them.`,()=>{
      delete CLASSES[id];delete store.classes[id];if(ui.cur===id)ui.cur=Object.keys(CLASSES)[0]||null;store.links=store.links.filter(l=>l.cls!==id);undoStack=undoStack.filter(u=>u.id!==id);
      saveLocal();markDirty("settings");render();toast(`Class ${id} deleted`);},"Delete class");break;}
    case "backup":doBackup();break;
    case "closeov":closeOverlay();break;
    case "noop":break;
    case "confirmyes":{const f=pendingYes;closeOverlay();if(f)f();break;}
  }
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="classSel"){ui.cur=t.value;IMP=null;saveLocal();render();return;}
  if(t.id==="ifile"&&t.files&&t.files[0]){const f=t.files[0];
    if(!($("#igame").value.trim()))$("#igame").value=f.name.replace(/\.[^.]+$/,"").slice(0,60);
    try{impFrom(await readFile(f));}catch(err){toast("Couldn't open this file here. Download the report as CSV, or copy and paste the table.");}
    t.value="";return;}
  if(t.id==="bfile"&&t.files&&t.files[0]){if(window.PartyWorkspace?.online&&!['points','activities','roster','materials'].every(k=>PartyWorkspace.can(k))){toast('Restoring a backup needs all classroom editing permissions.');t.value='';return;}const f=t.files[0];try{restoreBackup(await readAs(f,"text"));}catch(err){toast("Couldn't read this file");}t.value="";return;}
  if(t.id==="irule"&&IMP){IMP.rule=t.value;applyRule();RENDER.import();return;}
  if(t.id==="iteams"&&IMP){IMP.teams=t.checked;return;}
  if(t.dataset&&t.dataset.imp&&IMP){const it=IMP.items[+t.dataset.k];if(!it)return;
    if(t.dataset.imp==="seat"){const v=+t.value;if(v)IMP.items.forEach(o=>{if(o!==it&&o.seat===v)o.seat=0;});it.seat=v;it.dup=false;RENDER.import();}
    else it.pts=Math.max(0,Math.min(50,parseInt(t.value,10)||0));}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(!$("#overlay").hidden)closeOverlay();else if(document.body.classList.contains("present"))togglePresent();}
  if(e.key==="Enter"&&e.target.matches&&e.target.matches("tr.click")){recordDetail(+e.target.dataset.seat);}
});
</script>
